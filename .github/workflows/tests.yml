name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # every day: catches new Claude Agent SDK and Claude Code releases

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
          echo "$HOME/.temporalio" >> "$GITHUB_PATH"
      - name: Install the package (newest claude-agent-sdk allowed by pyproject)
        run: pip install -e ".[dev]"
      - name: Show versions
        run: |
          temporal --version
          python -m spike.engine --version
      - name: Tests (includes the real Claude Code engine with a stand-in model)
        run: pytest -v
      - name: Test matrix, Anthropic API mode (stand-in model)
        run: python -m spike.real_matrix --mock
      - name: Test matrix, Amazon Bedrock mode (stand-in model)
        run: python -m spike.real_matrix --mock-bedrock

  newest-claude-code:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
          echo "$HOME/.temporalio" >> "$GITHUB_PATH"
      - name: Install the package and the newest Claude Code
        run: |
          pip install -e ".[dev]"
          npm install --prefix .engine @anthropic-ai/claude-code@latest
          echo "CLAUDE_CLI_PATH=$GITHUB_WORKSPACE/.engine/node_modules/.bin/claude" >> "$GITHUB_ENV"
      - name: Show the engine version
        run: python -m spike.engine --version
      - name: Test matrix on the newest engine (stand-in model)
        run: python -m spike.real_matrix --mock
