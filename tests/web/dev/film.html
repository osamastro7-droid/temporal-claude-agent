<!-- Dev harness (tests/web/dev, not published). Draws one act of the film with the docs/map engine.
  ?act=a3&tau=3.0          act-local time (a1, a2, a3 are in docs/map; others come from the film repo via &more=)
  ?frame=667               a film2.html frame number instead (a1-a3 only): tau = frame/24 - act start, as the film's locate()
  &more=a8,a9              also load these acts from /film-src/scenes2/ (read-only film repo), after a3
  &raster=cpu              software canvas {willReadFrequently:true} for exact pixels (read by tests)
  &alpha=0                 getContext alpha:false (the game's canvas); default alpha:true (the film's canvas)
  &via=shop                draw through the game's SHOP.film (captions blanked, one routed back through the hook)
  &w=960                   backing width (setFormat only changes S)
  &loop=a3:4.72:13.887     play that window in a rAF loop at 24 drawings/s and record draw times (window.__dev.perf())
  window.__dev = { ready, draw(act, tau), tauOf(frame), perf(), canvas } -->
