<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'; manifest-src 'none'">
<meta name="referrer" content="no-referrer">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The refund that can’t happen twice</title>
<meta name="description" content="A playable pencil film: a Claude agent running durably on Temporal. Buy a teapot, ask for a refund, approve it, and pull the plug at any moment.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="map.css?v=1">
<script defer src="content.js?v=1"></script>
<script defer src="engine/core.js?v=1"></script>
<script defer src="engine/studio.js?v=1"></script>
<script defer src="engine/cels.js?v=1"></script>
<script defer src="engine/font-emstech.js?v=1"></script>
<script defer src="engine/logos.js?v=1"></script>
<script defer src="engine/kit.js?v=1"></script>
<script defer src="engine/cast.js?v=1"></script>
<script defer src="engine/stageB.js?v=1"></script>
<script defer src="engine/agent.js?v=1"></script>
<script defer src="engine/stageC.js?v=1"></script>
<script defer src="engine/stageD.js?v=1"></script>
<script defer src="game/boot.js?v=1"></script>
<script defer src="film/a1.js?v=1"></script>
<script defer src="film/a2.js?v=1"></script>
<script defer src="film/a3.js?v=1"></script>
<script defer src="game/name.js?v=1"></script>
<script defer src="game/shop.js?v=1"></script>
<script defer src="game/room.js?v=1"></script>
<script defer src="game/cards.js?v=1"></script>
<script defer src="game/sfx.js?v=1"></script>
<script defer src="game/story.js?v=1"></script>
<script defer src="game/ui.js?v=1"></script>
<script defer src="game/runtime.js?v=1"></script>
</head>
<body>
<main class="wrap">
  <header class="head">
    <h1 id="page-title" class="title">The refund that can’t happen twice</h1>
  </header>

  <section id="game" class="game">
    <div class="play">
      <div class="stage">
        <canvas id="cv" class="cv" width="1920" height="1080" aria-hidden="true"></canvas>
        <div id="hotspots" class="hotspots"></div>
      </div>

      <form id="nameform" class="nameform" autocomplete="off" novalidate>
        <label id="name-label" for="name-input"></label>
        <div class="name-row">
          <input id="name-input" name="player" type="text" maxlength="40" autocomplete="off" spellcheck="false" autocapitalize="words" aria-describedby="name-why name-privacy">
          <button id="name-start" type="submit" disabled></button>
        </div>
        <p id="name-why" class="why" aria-live="polite"></p>
        <label class="check"><input id="name-remember" type="checkbox"> <span id="name-remember-label"></span></label>
        <p id="name-privacy" class="note"></p>
      </form>

      <div id="controls" class="controls" role="group" hidden>
        <div class="ctl"><button id="btn-action" type="button" class="primary" aria-disabled="true" aria-describedby="why-action"></button><button id="btn-alt" type="button" aria-disabled="true" aria-describedby="why-action" hidden></button><span id="why-action" class="why"></span></div>
        <div class="ctl"><button id="btn-plug" type="button" class="plug" aria-pressed="false" aria-disabled="true" aria-describedby="why-plug"></button><span id="why-plug" class="why"></span></div>
        <div class="ctl toggles">
          <button id="btn-pause" type="button" aria-pressed="false"></button>
          <button id="btn-sound" type="button" aria-pressed="false"></button>
          <button id="btn-step" type="button" aria-pressed="false"></button>
        </div>
      </div>

      <div id="endbar" class="controls endbar" role="group" hidden>
        <button id="btn-again" type="button" class="primary"></button>
        <button id="btn-rename" type="button"></button>
        <button id="btn-break" type="button"></button>
      </div>

      <p id="status" class="status" role="status"></p>
    </div>

    <div class="side">
      <nav id="rail" class="rail" aria-labelledby="rail-label">
        <h2 id="rail-label" class="small"></h2>
        <ol></ol>
      </nav>
      <aside id="panel" class="panel">
        <p class="label" id="p-now-label"></p>
        <p id="p-now" class="now"></p>
        <p class="label" id="p-if-label"></p>
        <p id="p-if"></p>
        <p id="p-proof" class="note"></p>
        <p id="p-note"></p>
        <p id="p-retry-note" class="note"></p>
        <table id="p-retry" class="retry" hidden><thead></thead><tbody></tbody></table>
        <h3 id="p-book-label" class="small indigo"></h3>
        <ol id="p-book" class="book"></ol>
        <h3 id="p-history-label" class="small"></h3>
        <ol id="p-history" class="history"></ol>
      </aside>
    </div>
  </section>

  <div id="lower" class="lower">
    <section id="sec-cases" class="more"></section>
    <section id="sec-findings" class="more"></section>
    <section id="sec-proven" class="more"></section>
  </div>

  <footer id="footer" class="foot">
    <p id="footer-text">temporal-claude-agent, built in Python by Osamah Al-Harazi. Temporal and Claude marks belong to Temporal Technologies and Anthropic; this is a community project, not affiliated with or endorsed by either.</p>
    <p><a id="footer-lic" href="licenses/NOTICE.txt">Licences and credits</a></p>
  </footer>
  <noscript><p class="note">This page is a game drawn with JavaScript. Please turn JavaScript on to play.</p></noscript>
</main>
</body>
</html>
